gory:"Extracurriculars & Leadership",critical:!1,proTip:"In 9th grade, exploration is healthy. You do not need to be club president yet, just show up and observe what energizes you."},{id:"9-w-1",grade:"9th",season:"Winter",title:"Check In With Your High School Counselor",description:"Schedule a 15-minute intro meeting with your assigned counselor. Introduce yourself, express your college aspirations, and ask about high school course sequence pathways.",category:"College Research & List",critical:!1,proTip:"Counselors write your primary school recommendation in 12th grade. Starting a positive relationship now pays off immensely."},{id:"9-sp-1",grade:"9th",season:"Spring",title:"Plan 10th Grade Course Rigor (Honors/APs)",description:"Select next year’s courses. Challenge yourself in your strongest subjects (e.g., Honors Chemistry, AP Human Geography, advanced Math).",category:"Academics & Rigor",critical:!0,proTip:"Colleges evaluate whether you challenged yourself relative to what your high school offers, not against other schools."},{id:"9-su-1",grade:"9th",season:"Summer",title:"Pursue a Meaningful Summer Project or Habit",description:"Read 5–10 challenging non-fiction books, volunteer locally, work a summer job, learn coding or an instrument, or support family responsibilities.",category:"Extracurriculars & Leadership",critical:!1,proTip:"You do not need expensive $8,000 summer camps. Admissions officers respect paid work (babysitting, retail, lawn care) and self-directed initiatives just as much."},{id:"10-f-1",grade:"10th",season:"Fall",title:'Prune Activities & Identify Your "Spike"',description:"Narrow your focus from 5 clubs down to 2–3 meaningful pursuits where you can make tangible impact or take on organizing roles.",category:"Extracurriculars & Leadership",critical:!0,proTip:'Selective colleges look for excellence and deep curiosity in one or two domains (a "spike") rather than passive participation in 10 clubs.'},{id:"10-f-2",grade:"10th",season:"Fall",title:"Take the PSAT 10 / Pre-ACT as a Zero-Pressure Diagnostic",description:"Use the sophomore PSAT or Pre-ACT to identify test format preferences (SAT vs. ACT) without scores being reported to colleges.",category:"Standardized Testing",critical:!1,proTip:"Compare percentile splits to determine whether you naturally lean SAT (more reading nuance) or ACT (faster pace, dedicated science section)."},{id:"10-w-1",grade:"10th",season:"Winter",title:'Start an "Extracurricular & Honors Brag Tracker"',description:"Create a spreadsheet or doc tracking every activity, hours spent per week, weeks per year, awards won, and quantified outcomes.",category:"Essays & Applications",critical:!1,proTip:'Document numbers: "Raised $1,200", "Coached 14 middle schoolers", "Built website visited by 400 users". You will forget these details by senior year!'},{id:"10-sp-1",grade:"10th",season:"Spring",title:"Map Out Junior Year Rigor (Key AP / IB / DE Classes)",description:"Junior year is the most rigorous academic year colleges scrutinize. Plan AP/IB courses aligned with your intended area of study.",category:"Academics & Rigor",critical:!0,proTip:"Balance is crucial: 3–4 APs where you earn A’s is far better than 6 APs where your GPA tanks and mental health suffers."},{id:"10-su-1",grade:"10th",season:"Summer",title:"Launch a Leadership, Research, or Independent Project",description:"Design a self-directed capstone: conduct independent research with a professor, organize a local community campaign, or secure an internship.",category:"Extracurriculars & Leadership",critical:!0,proTip:"Initiative stands out. A student who creates an open-source biology tool independently often looks more compelling than someone attending a pay-to-play camp."},{id:"11-f-1",grade:"11th",season:"Fall",title:"Take the PSAT/NMSQT for National Merit Qualifying",description:"In October of junior year, the PSAT is the qualifying test for the National Merit Scholarship Program, which can unlock full-tuition scholarships.",category:"Standardized Testing",critical:!0,proTip:"Over 1.3 million juniors enter. Scoring in top 1% (Semifinalist) guarantees major scholarship money at universities like Alabama, Florida, and Tulsa."},{id:"11-f-2",grade:"11th",season:"Fall",title:"Maintain Peak Academic Performance (Junior Transcript)",description:"This is the most critical academic semester. Admissions officers pay closest attention to junior year grades and upward grade trends.",category:"Academics & Rigor",critical:!0,proTip:"If your grades slipped in 9th or 10th grade, a pristine junior year transcript demonstrates mature academic momentum."},{id:"11-w-1",grade:"11th",season:"Winter",title:"First Official SAT / ACT Test Administration",description:"Take your first official SAT (March) or ACT (February/April). Prepare with free resources like Khan Academy SAT prep or official practice tests.",category:"Standardized Testing",critical:!0,proTip:"Taking it in winter leaves room for a second test in May/June without bleeding into stressful senior fall application deadlines."},{id:"11-w-2",grade:"11th",season:"Winter",title:"Run Family Financial Talks & Net Price Calculators",description:"Sit down with parents/guardians to discuss college budget. Run Net Price Calculators (NPC) on 3 college websites to estimate actual out-of-pocket costs.",category:"Financial Aid & Scholarships",critical:!0,proTip:"Sticker price is a myth for many families! A $90K private college may cost less than a $35K in-state public if they meet 100% demonstrated financial need."},{id:"11-sp-1",grade:"11th",season:"Spring",title:"Ask 2 Core Academic Teachers for Recommendation Letters",description:"Politely ask two 11th-grade teachers in core academic subjects (e.g., 1 STEM, 1 Humanities) in person before summer break starts.",category:"Essays & Applications",critical:!0,proTip:"Popular teachers cap their recommendation lists by May. Ask early, and offer to provide an activity brag sheet."},{id:"11-sp-2",grade:"11th",season:"Spring",title:"Build Balanced Initial College List (Reaches, Targets, Safeties)",description:"Research 12–15 schools. Categorize by acceptance rates and academic fit: at least 2 financial/academic safeties you would genuinely LOVE to attend.",category:"College Research & List",critical:!0,proTip:"A safety is NOT a safety if you hate the school or your family cannot afford it. Love your safeties first!"},{id:"11-su-1",grade:"11th",season:"Summer",title:"Draft Common Application Personal Statement (650 words)",description:"The Common App prompts remain consistent. Write 2–3 rough drafts exploring who you are, your core values, and what drives you.",category:"Essays & Applications",critical:!0,proTip:"Focus on personal growth and perspective, not just recounting achievements. The essay is a mirror of your mind, not a second resume."},{id:"11-su-2",grade:"11th",season:"Summer",title:"Apply for QuestBridge National College Match (If Eligible)",description:"High-achieving students from low-income backgrounds (<$65K household income for family of 4) can apply for 4-year full-ride match scholarships.",category:"Financial Aid & Scholarships",critical:!1,proTip:"QuestBridge National College Match deadline is typically in late September. Completing the app over the summer is essential."},{id:"12-f-1",grade:"12th",season:"Fall",title:"Finalize Early Action (EA) & Early Decision (ED) Submissions",description:"Early deadlines are November 1 or 15. Submit Common App, supplemental essays, and ensure counselor sends transcript.",category:"Essays & Applications",critical:!0,proTip:"ED is binding (you must attend). Only use ED if you are 100% sure it is your #1 choice AND your family ran the Net Price Calculator and is happy with the cost."},{id:"12-f-2",grade:"12th",season:"Fall",title:"Submit FAFSA & CSS Profile as Soon as Portals Open",description:"File the Free Application for Federal Student Aid (FAFSA) and the CSS Profile (used by ~250 private colleges for institutional aid).",category:"Financial Aid & Scholarships",critical:!0,proTip:"Many state and institutional grant programs are first-come, first-served. File as early as possible with your family tax documentation."},{id:"12-f-3",grade:"12th",season:"Fall",title:"Submit UC Application (California) & UT/Texas ApplyTexas",description:"University of California applications are due November 30 (or early Dec). UC does not use Common App and requires 4 Personal Insight Questions.",category:"Essays & Applications",critical:!1,proTip:"UC essays are straightforward interviews: focus on concrete examples, direct context, and leadership, not flowery literary metaphors."},{id:"12-w-1",grade:"12th",season:"Winter",title:"Submit Regular Decision (RD) Applications (Jan 1 - 15)",description:'Polish school-specific supplemental essays ("Why Us?", "Community Contribution", "Academic Curiosity"). Double-check all portals.',category:"Essays & Applications",critical:!0,proTip:"Log into each university’s applicant portal immediately to verify test scores, transcripts, and recommendation letters have arrived."},{id:"12-w-2",grade:"12th",season:"Winter",title:"Mid-Year Transcript Report Review",description:"Counselors transmit your first-semester 12th grade marks to colleges in January/February. Keep grades sharp to protect regular decision chances.",category:"Academics & Rigor",critical:!0,proTip:"Do not succumb to senioritis early! Severe grade drops can lead to admissions rescissions or conditional probations."},{id:"12-sp-1",grade:"12th",season:"Spring",title:"Evaluate Financial Aid Award Letters & Appeal if Needed",description:"Compare net out-of-pocket costs across offers using an apples-to-apples spreadsheet. If circumstances changed, file a polite formal aid appeal.",category:"Financial Aid & Scholarships",critical:!0,proTip:"Check if grants are renewable for 4 years or if loans are subsidized vs unsubsidized. Leverage competitive offers if institutional policies allow."},{id:"12-sp-2",grade:"12th",season:"Spring",title:"National College Decision Day (May 1st)",description:"Submit your enrollment deposit to your chosen college by May 1. Decline your other offers to free up spots for waitlisted peers.",category:"College Research & List",critical:!0,proTip:"If placed on a waitlist you care about, submit a concise Letter of Continued Interest (LOCI) updating them on new 2nd-semester achievements."},{id:"12-su-1",grade:"12th",season:"Summer",title:"Final High School Transcript & Campus Transition",description:"Ensure your counselor sends the final official graduation transcript. Complete housing application, immunization forms, and sign up for freshman orientation.",category:"Academics & Rigor",critical:!1,proTip:"Celebrate your tremendous journey! You are embarking on an exciting, transformative chapter in your life."}],Xp={"9th":{title:"Freshman Year: Curiosity & Academic Foundation",badge:"Foundation Phase",theme:"Transition, exploration, and building solid study habits without burning out.",focus:"Academics, discovering personal interests, and getting involved in school life.",idealActivitiesCount:"3-4 clubs/hobbies to sample freely",testingStatus:"None required yet; enjoy learning"},"10th":{title:'Sophomore Year: Deepening Passion & "The Spike"',badge:"Differentiation Phase",theme:"Narrowing your interests, stepping up course rigor, and taking on preliminary leadership.",focus:"Commitment over quantity, low-stakes diagnostic testing, and independent projects.",idealActivitiesCount:"2-3 focused pursuits with clear initiative",testingStatus:"Optional PSAT 10 / Pre-ACT diagnostic"},"11th":{title:"Junior Year: The Crucible & Narrative Formation",badge:"Crucial Milestone Phase",theme:"Peak academic rigor, standardized test completion, and deep relationship with teachers.",focus:"Grades, testing, teacher relationships, and building a balanced college list.",idealActivitiesCount:"Core leadership or tangible regional/national impact",testingStatus:"PSAT/NMSQT in Fa bell rings to explain angular momentum to a confused classmate with zero condescension. An empathetic builder."',institutionalFactors:["Female applicant in STEM (institutional initiative to reach 50% women in engineering)","High demonstrated alignment with university maker-space & biomedical clinic"],actualDecision:"Admit",admitRateTarget:"11% acceptance rate committee",committeeDebate:"Strong consensus. Academic index is well above cutoff, but what propelled her past the finish line was applying engineering directly to humanitarian problems in her local community, backed by an enthusiastic teacher letter verifying her warmth and peer leadership.",decisionReasoning:'Elena demonstrates the classic "applied intellectual vitality." She doesn’t just score high on physics tests; she uses engineering to solve problems for real people.',tipForApplicants:"Show admissions officers how you will contribute to their campus community. Empathy and collaboration shine brighter than solo competition trophies."},{id:"sim-jordan",name:"Jordan Miller",intendedMajor:"Economics & Pre-Law",gpa:"4.00 UW / 4.60 W (14 APs - School Valedictorian)",testScore:"1600 SAT (Perfect Score)",schoolContext:"Affluent private independent academy ($45k tuition). Rank: 1/110.",ecSummary:["Economics Club: President (hosted 2 guest speakers).","Finance Summer Camp at prestigious Ivy university (paid tuition).","Model UN: Delegate for 2 years.","Piano: Classical player for 10 years (no regional competitions)."],essayExcerpt:'"Ever since Adam Smith penned The Wealth of Nations in 1776, the invisible hand has governed market equilibria. As valedictorian of my class, I have dedicated myself to mastering the economic theorems that will allow me to enter investment banking and maximize shareholder returns."',teacherRecSnippet:'"Jordan is undeniably the most intellectually capable test-taker I have taught this decade. He consistently earns 100% on every exam and challenges grading rubrics rigorously."',institutionalFactors:["High concentration of applicants from same private school (8 others applied with similar stats)","Full-pay applicant, but limited community involvement"],actualDecision:"Waitlist",admitRateTarget:"11% acceptance rate committee",committeeDebate:"Heavy split. The numbers are pristine (1600 SAT, 4.0 GPA, Valedictorian), but the file felt cold and transactional. The essay read like a Wikipedia article about Adam Smith rather than personal introspection. The teacher note hinted at grade obsession, and activities were passive.",decisionReasoning:"In a pool where 70% of applicants are academically qualified, test scores alone do not guarantee admission. Jordan’s application lacked warmth, authentic community engagement, and intellectual humility.",tipForApplicants:"Never write your personal statement like an academic term paper. Valedictorian status does not excuse generic extracurriculars or lack of demonstrated empathy."},{id:"sim-mateo",name:"Mateo Morales",intendedMajor:"Environmental Science & Urban Agriculture",gpa:"3.89 UW / 4.10 W (4 APs - max offered by high school)",testScore:"1390 SAT (710 Math, 680 EBRW) - Top 2% in his school district",schoolContext:"Under-resourced urban high school (Title I, 82% free/reduced lunch, only 4 APs offered). Rank: 2/310.",ecSummary:["Urban Food Rescue Project: Co-founded neighborhood network redistributing leftover produce from 14 grocery stores to 85 food-insecure families weekly.","Family Support: Works 18 hours/week at father’s automotive tire shop managing billing and customer relations.","School Environmental Club: Led initiative converting abandoned lot behind school into native pollinator garden."],essayExcerpt:'"Under the chassis of a 2004 Ford Taurus, motor oil dripping inches from my goggles, I learned the poetry of preventive maintenance. You don’t ignore a trembling axle, just as you cannot ignore the nutritional deserts cutting through our East Side neighborhood."',teacherRecSnippet:'"Mateo is the heart of this school. When our district cut our science lab budget, Mateo rallied local tradespeople to donate refurbished microscopes. He makes everyone around him feel capable."',institutionalFactors:["First-generation college student, Pell Grant eligible","Geographic diversity (underrepresented urban district)"],actualDecision:"Admit",admitRateTarget:"11% acceptance rate committee",committeeDebate:"Overwhelming admit with priority institutional scholarship endorsement. While his 1390 SAT is below the median for wealthy suburbs, in the context of his high school it is in the 99th percentile. His work ethic, tangible civic leadership, and voice are sterling.",decisionReasoning:"Mateo embodies grit and maximize-the-moment agency. Admissions officers evaluate applicants within the context of opportunity. Mateo squeezed every drop of opportunity out of an under-resourced school.",tipForApplicants:"Never feel discouraged by lower test scores if you have maximized rigor in your own school context and demonstrated genuine leadership that transforms people’s lives."},{id:"sim-chloe",name:"Chloe Zhang",intendedMajor:"Art History & Curatorial Studies",gpa:"3.78 UW / 4.15 W (6 APs, upward trend: 3.5 9th -> 4.0 11th)",testScore:"Test-Optional (Chose not to submit)",schoolContext:"Large suburban public school. Rank: Top 15%.",ecSummary:["Youth Art Docent: Led free weekend gallery walks at city museum for neurodivergent children and their families.","Independent Ceramicist: Sells handmade stoneware at artisan markets; donated 50% of profits ($1,800) to youth shelter arts programs.","School Literary Magazine: Art Director, oversaw layout and redesign in InDesign."],essayExcerpt:'"I used to think restoration meant erasing cracks. But when I studied Kintsugi—the Japanese craft of mending broken pottery with lacquer dusted with powdered gold—I realized that honoring the fractures tells a richer story than pretending the vase was never dropped."',teacherRecSnippet:'"Chloe experienced significant medical illness during freshman year, which explains her early transcript marks. Her intellectual rebound and creative energy in junior year was breathtaking to witness."',institutionalFactors:["Strong institutional need: University Art History department is actively seeking to rebuild cohort enrollment with passionate majors"],actualDecision:"Admit",admitRateTarget:"11% acceptance rate committee",committeeDebate:"Strong advocate from the regional officer. Her freshman grades dipped due to documented medical circumstances, followed by straight A’s in rigorous junior humanities courses. Her artistic portfolio and community work were exceptional, and she fills a distinct institutional need.",decisionReasoning:"Holistic review rewards upward trends with compelling context. Chloe’s art history focus addresses an under-enrolled department, and her unique visual storytelling makes her a standout.",tipForApplicants:'An imperfect GPA in 9th grade will not sink your application if you show a dramatic upward trend in 10th and 11th grade and use the "Additional Information" section wisely.'},{id:"sim-tyler",name:"Tyler Brooks",intendedMajor:"Business Administration",gpa:"3.71 UW / 4.02 W (5 APs, downward trend in senior fall)",testScore:"1450 SAT",schoolContext:"Well-resourced suburban public school (offers 24 APs). Rank: Top 25%.",ecSummary:['Founder of "TeenBiz Network" nonprofit: website created junior summer, no documented events or members.',"Member of 9 clubs (DECA, Key Club, NHS, French Club, Chess, etc.), with no leadership roles.","2-week paid entrepreneurship summer program at a university campus."],essayExcerpt:'"Ever since I was young, I have always been passionate about business. Business teaches leadership, teamwork, and perseverance, which are qualities I have demonstrated throughout my life in many ways."',teacherRecSnippet:'"Tyler is a pleasant student who completes assignments on time. He received a B+ in my course."',institutionalFactors:["Business school is the most oversubscribed program on campus","Senior fall grades dropped (two B-minuses in APs)"],actualDecision:"Deny",admitRateTarget:"11% acceptance rate committee",committeeDebate:'Quick consensus. The "nonprofit" looked like it was built for the resume and had no real impact. The essay was abstract and full of clichés, and the teacher letter was lukewarm. With a downward grade trend for the most competitive major, nothing set him apart.',decisionReasoning:"Titles without results, a generic essay, and a flat recommendation leave the committee no reason to say yes to a heavily oversubscribed major.",tipForApplicants:'A "founder" title means nothing without evidence: members, money raised, events held. Officers check. One authentic commitment beats nine passive ones.'},{id:"sim-amara",name:"Amara Okafor",intendedMajor:"Neuroscience",gpa:"3.97 UW / 4.40 W (10 APs)",testScore:"1530 SAT",schoolContext:"Strong public magnet school (sends ~30 students/year to T20s). Rank: not reported.",ecSummary:["Hospital volunteer: 200+ hours in pediatric wing reading to patients.","Science Olympiad: State medalist in Anatomy & Physiology.","Varsity Track (400m) and Peer tutoring."],essayExcerpt:'"My little cousin asked why her brain made her seizures happen at night. I didn’t know. Three years and one secondhand EEG textbook later, I still don’t fully know, but I now know how to ask the right questions."',teacherRecSnippet:'"Amara is among the strongest students in a very strong cohort. Thoughtful, kind, and diligent."',institutionalFactors:["14 other applicants from her magnet school with similar profiles","Pre-med/neuroscience is a high-volume applicant pool"],actualDecision:"Waitlist",admitRateTarget:"11% acceptance rate committee",committeeDebate:"Everyone liked her, and that was the problem: she was excellent but very similar to many others in the pre-med pool and at her own school. The essay was lovely, but her activities followed the standard pre-med template. Placed o hoice EA",shortCode:"REA / SCEA",category:"Application Cycles",definition:"A non-binding early plan with strict restrictions: you cannot apply Early Action or Early Decision to other private universities (though public universities are usually permitted).",exampleOrContext:"Used by Harvard, Yale, Princeton, Stanford, and Notre Dame. You are not forced to attend if admitted, but you cannot apply EA to other private colleges."},{term:"Regular Decision (RD)",shortCode:"RD",category:"Application Cycles",definition:"The standard non-binding application cycle with deadlines in early January (Jan 1 - 15) and decisions released in late March. Candidates have until May 1 to decide.",exampleOrContext:"Gives applicants more time to finalize test scores, essays, and showcase strong first-semester senior year grades."},{term:"Student Aid Index (SAI)",shortCode:"SAI",category:"Financial Aid",definition:"The eligibility index number calculated by the FAFSA (replacing the old EFC / Expected Family Contribution). It determines federal Pell Grant eligibility and financial need.",exampleOrContext:"An SAI can range from -1500 to positive numbers. A lower or negative SAI indicates maximum financial need."},{term:"Net Price Calculator (NPC)",shortCode:"NPC",category:"Financial Aid",definition:"A federal law-mandated tool on every college website that provides personalized estimates of your family’s actual out-of-pocket cost after merit and need-based grants.",exampleOrContext:'Always look for the college’s "Net Price", not the $85,000+ "Sticker Price". Use this before applying Early Decision!'},{term:"Common Data Set (CDS)",shortCode:"CDS",category:"Admissions Data",definition:"A standardized statistical report published annually by colleges providing transparent data on acceptance rates, middle 50% test scores, GPAs, and institutional priorities.",exampleOrContext:'Search "[University Name] Common Data Set Section C7" on Google to see whether the school considers interviews or demonstrated interest!'},{term:"Holistic Review",shortCode:"Holistic",category:"Admissions Process",definition:"An evaluation process where an applicant is assessed as a whole person within their educational context—factoring in essays, extracurricular impact, teacher recommendations, and life circumstances alongside grades and test scores.",exampleOrContext:"Under holistic review, a student with a 3.8 GPA who works 20 hrs/week to support family can easily be admitted over a 4.0 student with zero extracurricular depth."},{term:"Superscore",shortCode:"Superscore",category:"Standardized Testing",definition:"The policy of combining your highest section scores across multiple SAT or ACT test dates to generate your highest composite score.",exampleOrContext:"If you scored 750 Math / 650 EBRW in March, and 700 Math / 740 EBRW in June, a superscoring college evaluates you as having a 1490 (750 + 740)."},{term:"FERPA Waiver",shortCode:"FERPA",category:"Applications",definition:"The Family Educational Rights and Privacy Act waiver on the Common App. Waiving your rights means you agree not to read your teachers’ recommendation letters.",exampleOrContext:"ALWAYS waive your FERPA rights! If you do not waive them, admissions officers suspect your teachers were pressured or felt unable to write candidly."},{term:"Demonstrated Interest",shortCode:"DI",category:"Admissions Process",definition:"Actions an applicant takes to show a college they are serious about enrolling if accepted (e.g., campus tours, virtual webinars, clicking email newsletters, optional interviews).",exampleOrContext:"Many mid-sized private institutions (Tulane, Syracuse, Case Western) track demonstrated interest to protect their admissions yield."},{term:"Need-Blind vs. Need-Aware",shortCode:"Need-Blind",category:"Financial Aid",definition:"Need-blind colleges do not look at your ability to pay when deciding whether to admit you. Need-aware colleges consider financial need, especially for borderline applicants.",exampleOrContext:"Roughly 100 top colleges in the US are need-blind for domestic applicants, and a rare handful are need-blind for international students as well."}],Rg=[{keywords:["when","start","begin","early","freshman","9th"],answer:'Start in 9th grade with strong grades and exploring activities. No pressure to "build a resume" yet. The real application work (testing, lists, essays) ramps up in 11th grade.',link:{label:"Open the 4-year timeline",view:"timeline"}},{keywords:["sat","act","test","score","optional","submit"],answer:"Take your first official SAT/ACT in winter or spring of junior year so you have room to retake. Submit your score to a test-optional school if it’s at or above that school’s middle-50% range. Otherwise, consider applying without it.",link:{label:"See free test-prep resources",view:"resources"}},{keywords:["essay","personal statement","write","topic","cliche","cliché"],answer:"Your essay should show how you think, not repeat your resume. Small, specific moments beat dramatic clichés. Try the Hallway Test: if your friends found it with no name on it, would they know it was yours?",link:{label:"Try the Cliché Detector",view:"pitfalls"}},{keywords:["extracurricular","club","activities","activity","spike","leadership"],answer:"Depth beats breadth. Two or three activities with measurable impact (people helped, money raised, things built) stand out far more than ten passive memberships. Jobs and family responsibilities count too!",link:{label:"Polish your activity descriptions",view:"tools"}},{keywords:["money","afford","cost","financial","aid","fafsa","css","price","scholarship","expensive"],answer:"Never judge a school by its sticker price. Run the Net Price Calculator on its website. Many private colleges meet 100% of need with grants. File the FAFSA (and the CSS Profile if your schools require it) as early as possible in senior fall.",link:{label:"Use the Net Price Decoder",view:"tools"}},{keywords:["list","how many","reach","target","safety","schools","apply to"],answer:"A healthy list is usually 8–12 schools: 3–4 reaches, 3–4 targets, and 2–3 safeties you’d genuinely be happy to attend and can afford.",link:{label:"Balance your college list",view:"tools"}},{keywords:["recommendation","rec","letter","teacher","counselor"],answer:"Ask two junior-year core-subject teachers in person in late spring of 11th grade. Follow up with a brag sheet full of specific stories from their class. Always waive your FERPA rights.",link:{label:"Copy the request template",view:"templates"}},{keywords:["early decision","early action","ed","ea","binding","deadline"],answer:"Early Action is non-binding and usually due Nov 1–15. Early Decision is binding: only use it for a clear #1 school where your family has already checked the cost.",link:{label:"See the deadline calendar",view:"timeline"}},{keywords:["waitlist","deferred","defer","loci"],answer:"Send a short Letter of Continued Interest with genuinely new updates (grades, awards, projects). If the school is your top choice and you’d attend, say so clearly. Also commit to another school by May 1 as a backup.",link:{label:"Get the LOCI template",view:"templates"}},{keywords:["gpa","grades","bad grade","low","trend","transcript"],answer:"An upward trend matters a lot. A rough freshman year followed by strong junior grades tells a story of growth. Use the Additional Information section to briefly explain real circumstances (illness, family events).",link:{label:"Read real case studies",view:"cases"}},{keywords:["first-gen","first gen","low income","questbridge","full ride"],answer:"Look into QuestBridge (apply over junior summer), fly-in programs, and fee waivers. Colleges evaluate you in the context of your opportunities, so maximizing what your school offers counts.",link:{label:"Explore the Resource Vault",view:"resources"}},{keywords:["interview","demonstrated interest","visit","tour"],answer:"If an interview is offered, take it. It’s a chance to show your personality. Some colleges track demonstrated interest, so attend info sessions and engage thoughtfully with your target schools."}],Og=["When should I start preparing?","Should I submit my SAT score?","How many colleges should I apply to?","How do I pay for an expensive college?","What makes a good essay topic?","What is Early Decision?"],_g=x=>{const y=x.toLowerCase();let R=null,u=0;for(const E of Rg){const j=E.keywords.reduce((H,C)=>H+(new RegExp(`\\b${C}`).test(y)?C.length:0),0);j>u&&(u=j,R=E)}const U=xf.find(E=>y.includes(E.term.toLowerCase().split(" (")[0])||E.shortCode&&new RegExp(`\\b${E.shortCode.toLowerCase().split(" ")[0]}\\b`).test(y));return U&&(u<4||y.startsWith("what is")||y.startsWith("what’s")||y.startsWith("what's"))?{text:`${U.term}: ${U.definition}

nts; mentored 22 middle school girls in Python fundamentals.",tier:"Tier 2 (State/Regional Leader)"},{title:"Varsity Cross Country",role:"Team Captain (Senior year)",impact:"4-year varsity runner. Organized weekly team mindfulness sessions; 5K PR: 19:42.",tier:"Tier 3 (School Leader)"}],essayStrategy:{personalStatementTopic:"Fermenting Sourdough & Gene Sequencing",whyItWorkedOrFailed:"Rather than a dry recitation of lab equipment, Maya connected her grandma’s wild yeast sourdough starter with the stochastic nature of algorithmic DNA sequencing. It showcased humor, familial warmth, curiosity, and intellectual humility.",keyThemes:["Microbial wonders","Family lineage","Patience with failed experiments"]},collegeListStrategy:{reach:["MIT (Early Action)","Stanford (RD)","Harvard (RD)","Caltech (EA)","Columbia (RD)"],target:["Georgia Tech (EA)","Carnegie Mellon (RD)","University of Michigan (EA)"],safety:["Rutgers University - New Brunswick (In-State Honors)","Penn State (Schreyer)"],totalApplied:10},admissionsOutcomes:{accepted:["MIT (EA - Attending)","Stanford University","Georgia Tech (Presidents Scholar)","Carnegie Mellon University","Rutgers Honors College (Full Tuition)"],waitlisted:["Harvard University","Columbia University"],rejected:["Caltech"],attending:"Massachusetts Institute of Technology (MIT)",scholarshipOrAid:"$62,000/year institutional need-based grant from MIT"},admissionsOfficerTakeaway:"Maya succeeded because her academic spike was authentic and backed by independent curiosity (cold emailing labs, self-directed research) rather than expensive pay-to-play programs. Her essay humanized an otherwise intimidating STEM profile.",keyLessons:["Depth > Breadth: A focused passion in computational genomics is far more memorable to committees than being president of 6 unrelated clubs.","Authentic research: Admissions officers can easily spot pay-to-play summer programs. Maya did genuine lab legwork.","Essays must show personality: STEM students who write solely about equations come off as one-dimensional. Connect science to human values."]},{id:"case-marcus",name:"Marcus T.",tagline:"The Community Storyteller & Youth Mental Health Advocate",avatar:"🎙️",avatarColor:"from-amber-600 to-rose-500",archetype:"Humanities & Community",gpa:{unweighted:3.84,weighted:4.18,rigorNote:"7 APs, 4 Dual-Enrollment courses (Heavy English, History, and Sociology)"},satAct:"1440 SAT (760 EBRW, 680 Math) - Submitted to some, went test-optional to Ivies",highSchoolType:"Mid-sized Rural Public School (North Carolina)",intendedMajor:"Sociology & Public Policy (Pre-Law)",demographics:"African American male, first in family to attend 4-year private university",topExtracurriculars:[{title:'"Unspoken" Teen Mental Health Zine & Podcast',role:"Founder & Editor-in-Chief",impact:"Launched quarterly student-run publication discussing rural youth isolation. Distributed 1,500 physical copies across 8 county libraries; featured on NPR local affiliate.",tier:"Tier 1 (National/Unique)"},{title:"County Youth Advisory Board",role:"Chairperson",impact:"Successfully lobbied county commissioners to allocate $45,000 in ARPA funding for mobile adolescent counseling clinics in underserved school districts.",tier:"Tier 2 (State/Regional Leader)"},{title:"Speech & Debate (Original Oratory)",role:"Captain & State Finalist",impact:"Mentored 12 novice debaters; placed 3rd at NC State Forensics championship speaking on healthcare deserts.",tier:"Tier 2 (State/Regional Leader)"},{title:"Part-Time Cook at Local Diner",role:"Line Cook (16 hrs/week throughout 11th & 12th)",impact:"Contributed 30% of earnings toward household grocery expenses; managed busy breakfast rush.",tier:"Tier 3 (School Leader)"}],essayStrategy:{personalStatementTopic:"Washing Skillets at 6:00 AM on Sunday Mornings",whyItWorkedOrFailed:"Marcus wrote about listening to elderly regulars, truck drivers, and churchgoers at the local diner. He turned grease and bacon sizzle into a masterclass on active listening, civic empathy, and bridging generational divides in rural America.",keyThemes:["Working-class dignity","Active listening","Bridging rural divides"]},collegeListStrategy:{reach:["Williams College (RD)","Brown University (RD)","Amherst College (RD)","Wesleyan University (ED2)"],target:["UNC Chapel Hill (In-State EA)","Wake Forest University (RD)","NYU Gallatin (RD)"],safety:["UNC Asheville (In-state)","Appalachian State University"],totalApplied:9},admissionsOutcomes:{accepted:["Williams College (Attending)","Wesleyan University","UNC Chapel Hill (Morehead-Cain Finalist)","NYU Gallatin","UNC Asheville"],waitlisted:["Amherst College"],rejected:["Brown University"],attending:"Williams College",scholarshipOrAid:"Williams All-Grant Financial Aid ($78,500/yr full need met, zero loans)"},admissionsOfficerTakeaway:"Marcus was an irresistible fit for liberal arts colleges. His civic engagement directly benefited his physical hometown, and his work at the diner conveyed humility, grit, and grounded character that admissions committees fight for.",keyLessons:["Part-time jobs ARE top extracurriculars: Working to support your family demonstrates maturity and time management often superior to fabricated non-profits.","Test-optional strategy worked: By selectively submitting his 1440 to UNC and going test-optional at ultra-selective Ivies, he avoided score-based cutoffs.","Liberal arts colleges cherish voice: Marcus’s essay made the committee feel like they already knew him personally."]},{id:"case-sofia",name:"Sofia R.",tagline:"The First-Gen High Achiever & QuestBridge National Match",avatar:"🌟",avatarColor:"from-mint-600 to-mint-500",archetype:"First-Gen QuestBridge",gpa:{unweighted:4,weighted:4.22,rigorNote:"Maxed out school offerings: 4 APs (all school had), 6 community college dual-enrollment classes"},satAct:"1380 SAT (710 EBRW, 670 Math) - Used QuestBridge test-flexible policy",highSchoolType:"High-poverty Title I Public School (Central Valley, CA)",intendedMajor:"Civil & Environmental Engineering",demographics:"First-generation to college, Latina, household income under $38,000",topExtracurriculars:[{title:"Primary Family Caregiver & English Translator",role:"Eldest Daughter (20+ hrs/week)",impact:"Managed medical appointments, translated government forms, and tutored 3 younger siblings daily while parents worked 12-hour agricultural shifts.",tier:"Tier 1 (National/Unique)"},{title:"Community Clean Drinking Water Initiative",role:"Student Organizer",impact:"Collaborated with clean water nonprofit to test tap water nitrate levels across 60 mobile home parks; presented data to city council.",tier:"Tier 2 (State/Regional Leader)"},{title:"School Math & Science Peer Tutoring Club",role:"Co-Founder",impact:"Provided bilingual math tutoring in Spanish and English for 45 newly arrived immigrant students; improved algebra pass rate by 18%.",tier:"Tier 3 (School Leader)"},{title:"High School Band (Flute & Marimba)",role:"Section Leader",impact:"Practiced before school at 6:30 AM; led section to regional festival excellent rating.",tier:"Tier 3 (School Leader)"}],essayStrategy:{personalStatementTopic:"The Kitchen Table Translation Desk",whyItWorkedOrFailed:"Sofia chronicled translating tax documents and medical diagnoses for her parents at age 11. Instead of a pity story, it was written with profound pride, illustrating how navigating bureaucratic labyrinths sparked her passion for equitable civil infrastructure.",keyThemes:["Resilience","Bilingual empowerment","Infrastructural justice"]},collegeListStrategy:{reach:["Princeton University (QuestBridge Match)","Stanford (QB Match)","Yale (QB Match)","Columbia (QB Match)"],target:["UC Davis (In-State)","Cal Poly San Luis Obispo"],safety:["Fresno State (CSU Safety)","UC Merced"],totalApplied:8},admissionsOutcomes:{accepted:["Princeton University (QuestBridge Matched - Attending)","UC Davis","Fresno State (Presidential Scholarship)","UC Merced"],waitlisted:[],rejected:[],attending:"Princeton University",scholarshipOrAid:"100% Full-Ride QuestBridge Match: $85,000/yr (Tuition, Room, Board, Books & Travel Covered)"},admissionsOfficerTakeaway:'Sofia is the ideal candidate evaluated "within the context of her environment." She took every single challenging course her school offered, balanced extraordinary family obligations, and channeled local struggles into civic solutions.',keyLessons:["Context is everything: Admissions officers judge you by what opportunities were available to you, not an unfair comparison to a $60,000 private prep academy.","Family responsibilities matter on the Common App: Taking care of siblings or translating for parents is a full-tier activity that shows immense maturity.","QuestBridge is life-changing: Low-income students must look into QuestBridge National College Match and fly-in programs by junior spring."]},{id:"case-liam",name:"Liam B.",tagline:'The "Top-Heavy List & Cliché Narrative" Pitfall Cautionary Tale',avatar:"⚠️",avatarColor:"from-amethyst-600 to-amethyst-700",archetype:"High Stats / Top-Heavy Pitfall",gpa:{unweighted:3.96,weighted:4.38,rigorNote:"11 APs with stellar test scores"},satAct:"1540 SAT (770 Math, 770 EBRW)",highSchoolType:"Affluent Suburban Public High School (Illinois)",intendedMajor:"Economics / Finance",demographics:"Upper-middle-class, non-first-gen",topExtracurriculars:[{title:"Model United Nations",role:"General Member (10th-12th)",impact:"Attended 3 local weekend conferences; did not hold executive board positions or train younger members.",tier:"Tier 4 (General Member)"},{title:"National Honor Society",role:"Member",impact:"Completed required 15 hours of community cleanup; passive attendance at monthly meetings.",tier:"Tier 4 (General Member)"},{title:"Varsity Tennis",role:"JV Player (9-10), Varsity Alternate (11-12)",impact:"Practiced daily with team; had fun but no state recognition or captainship.",tier:"Tier 3 (School Leader)"},{title:"Summer Study Abroad Program in France",role:"Participant ($7,500 pay-to-attend camp)",impact:"Took introductory conversational French and toured Parisian landmarks for 3 weeks.",tier:"Tier 4 (General Member)"}],essayStrategy:{personalStatementTopic:"Losing the Deciding Match in the County Tennis Semifinals",whyItWorkedOrFailed:'FAILED: The essay followed the exact sports cliché: "I lost the match, cried, resolved to practice harder, and realized life is about resilience." Admissions officers read thousands of these every week. It revealed nothing unique about Liam’s intellectual curiosity or worldview.',keyThemes:["Sports defeat","Working harder","Cliché teamwork quote"]},collegeListStrategy:{reach:["Harvard","Yale","UPenn Wharton","Duke","Northwestern","UChicago","Dartmouth","Brown","Cornell","Vanderbilt","Georgetown","Notre Dame"],target:["NYU Stern","Boston College","University of Michigan (OOS)"],safety:["University of Illinois Urbana-Champaign (UIUC In-state)"],totalApplied:16},admissionsOutcomes:{accepted:["UIUC (Attending - In-State Match/Safety)"],waitlisted:["Boston College","NYU Stern"],rejected:["Harvard","Yale","UPenn","Duke","Northwestern","UChicago","Dartmouth","Brown","Cornell","Vanderbilt","Georgetown","Notre Dame","University of Michigan"],attending:"University of Illinois Urbana-Champaign (UIUC)",scholarshipOrAid:"Standard in-state tuition"},admissionsOfficerTakeaway:"Liam had exceptional numbers (1540 SAT, 3.96 GPA), but so did 40,000 other applicants. With no clear spike, generic passive club memberships, a cliché essay, and a dangerously top-heavy list of 12 reaches, he fell into the classic rejection cascade.",keyLessons:["Stats only get your foot in the door: Beyond ~1500 SAT / 3.9 GPA, admissions decisions at T20s are determined by essays, impact, and unique voice.",'Beware the "Top-Heavy List": Applying to 12 reaches with single-digit acceptance rates is not an "eggs in different baskets" strategy—they are all lottery tickets.','Sports injury / defeat essays are red flags: Unless you have an extraordina all-1",number:1,title:'The "Laundry List" of 10 Random Clubs',subtitle:"Quantity over depth, passive attendance over real-world impact.",severity:"Critical",category:"Extracurriculars",whatHappens:"Students join 8 to 12 clubs in high school—French Club, Model UN, Key Club, DECA, NHS, Baking Club—attending monthly meetings simply to pad their resume with titles.",theTruth:'Admissions officers can spot passive membership in 5 seconds. Highly selective colleges prefer a "spiky" profile (deep, demonstrated impact in 2 or 3 domains) over a "well-rounded" laundry list where the applicant was just a warm body in a chair.',beforeSnippet:"Member of Key Club, Spanish Club, Environmental Club, NHS, Robotics Club (attends meetings twice a month).",afterSnippet:"Led Environmental Club campaign: petitioned school board to install 14 solar arrays, saving district $24,000 annually in electricity costs.",actionSteps:["Conduct an honest audit: Which 2 activities would you still do if colleges never saw your application?","Drop passive clubs and redirect those 5-10 hours toward one self-directed initiative or community leadership role.","Quantify your outcomes: How many people did you serve? How much money did you raise? What was the lasting system you built?"],quoteFromAdmissions:'"We don’t want well-rounded students. We want a well-rounded class composed of uniquely lopsided, deeply passionate individuals."'},{id:"pitfall-2",number:2,title:"The Trite & Cliché Personal Statement Topics",subtitle:"The sports injury, the mission trip epiphany, or the dictionary definition hook.",severity:"Critical",category:"Essays",whatHappens:'Applicants write about tearing their ACL in the big game, visiting a developing country for 7 days and "discovering how grateful they are," or starting their essay with "Webster’s Dictionary defines perseverance as..."',theTruth:"Admissions officers read between 30 and 50 essays every single day during reading season. Cliché topics make readers glaze over. The personal statement is not about proving you suffered—it is an audition for who you will be as a dorm roommate, lab partner, and seminar participant.",beforeSnippet:'"It was the 4th quarter. With 12 seconds remaining, my meniscus tore. In that moment of agony, I discovered that true triumph isn’t about winning on the field, but winning the game of life."',afterSnippet:'"Every Sunday at 6:00 AM, my grandfather and I untangle 300 feet of nylon gillnets on the dock. Fish scales embed beneath my fingernails like mica flakes. It was while deciphering salinity charts with him that I learned to love chemistry."',actionSteps:['The "Five People" Rule: If you drop your essay in the hallway without your name on it, could your 5 closest friends immediately identify it as yours?',"Focus on the mundane and micro: Everyday moments (fixing a bicycle, baking bread, arguing about board games) often illuminate character better than dramatic epics.",'Pass the "So What?" test: Spend at least 50% of the essay analyzing your introspection and growth, not just describing the event.'],quoteFromAdmissions:'"Write about what makes you tick, not what you think we want to hear. The moment you try to sound like a 40-year-old scholar, you lose your teenage sparkle."'},{id:"pitfall-3",number:3,title:"The Top-Heavy College List Disaster",subtitle:"15 Reaches, 1 Target, and zero Safeties you actually like.",severity:"Critical",category:"College List",whatHappens:'Students build lists consisting entirely of Ivy League, Stanford, MIT, Duke, and UC Berkeley, with one random local state school they view with disdain as a "backup."',theTruth:"With acceptance rates at T20 colleges hovering between 3% and 9%, every single reach school is a statistical lottery. A top-heavy list frequently leads to 14 rejections in late March, creating devastating heartbreak and zero exciting options.",beforeSnippet:"List: Harvard, Yale, Princeton, Columbia, UPenn, Brown, Cornell, Stanford, Duke, Northwestern, Caltech, MIT, Safety: State U (unresearched).",afterSnippet:"Balanced List: 4 Reaches (Ivies/T20s), 4 Strong Targets (e.g., Rochester, Wake Forest, UW-Madison, Case Western), 3 True Safeties (e.g., Pitt Honors, In-State Flagship with guaranteed merit, SUNY Binghamton).",actionSteps:["Rule of thumb: A healthy list usually features 3-4 Reaches, 3-4 Targets, and 2-3 genuine Safeties (both academic AND financial).","The Golden Rule: You must be genuinely excited to attend every single school on your list, especially your safeties.","Check acceptance rates and 25th-75th percentile SAT/ACT and GPA ranges using the university’s latest Common Data Set (CDS)."],quoteFromAdmissions:'"If you would be depressed opening an acceptance letter from your safety school, that school does not belong on your list."'},{id:"pitfall-4",number:4,title:"Sticker Price Shock & Missing Financial Aid Deadlines",subtitle:"Ignoring Net Price Calculators and confusing Merit vs Need-Based aid.",severity:"Critical",category:"Financial Aid",whatHappens:"Families assume they cannot afford private colleges because of the $85,000/year sticker price, OR conversely, a student gets accepted to their dream school only to discover the family cannot afford $50,000/year out-of-pocket because they missed the CSS Profile priority deadline.",theTruth:"Many top private colleges have multibillion-dollar endowments and offer generous need-based financial aid with ZERO student loans. A $85k school can actually be cheaper than an in-state public university for low- and middle-income families.",beforeSnippet:'"We won’t apply to Amherst or Rice because $88k/yr is impossible. We’ll just apply anywhere and hope they give us a scholarship in April."',afterSnippet:"Ran Amherst’s Net Price Calculator in September: Estimated Family Contribution is $7,200/year with $78,000 grant. Submitted CSS Profile before Nov 1 deadline.",actionSteps:["Run the official Net Price Calculator (NPC) on at least 3 college websites during junior year spring or senior year early fall.",'Know the difference: Need-blind vs Need-aware admissions, and full-need-met colleges vs colleges that "gap" financial aid.',"File FAFSA and CSS Profile as early as possible. Note separate priority financial aid deadlines which are often EARLIER than regular application deadlines."],quoteFromAdmissions:'"Admissions and financial aid are often separate offices. Getting admitted means nothing if the financial package doesn’t work for your family."'},{id:"pitfall-5",number:5,title:"Last-Minute Teacher Recommendation Rush",subtitle:"Asking teachers with two weeks notice and zero context or brag sheet.",severity:"High",category:"Letters of Rec",whatHappens:"Students ask popular 11th-grade teachers in mid-October for a November 1st Early Action deadline, offering no context or resume, forcing the teacher to write a rushed, generic letter.",theTruth:'Great letters of recommendation provide vivid anecdotes of your intellectual curiosity in the classroom. Rushed letters are dry templates ("Student X always turned homework in on time and received an A").',beforeSnippet:'Email sent Oct 22: "Hi Mr. Davis, can you write my rec letter for Early Action due next week? Thanks!"',afterSnippet:"In May of Junior year: In-person conversation, followed by a formal email with an attached 2-page Brag Sheet highlighting specific projects, classroom debates, and paper topics.",actionSteps:["Ask two core academic teachers (e.g., 1 STEM, 1 Humanities) in person before junior year ends (May/June).",'Provide a comprehensive "Brag Sheet" detailing specific papers you wrote, challenges you overcame in their class, and your future goals.',"Always waive your rights under FERPA on the Common App. Admissions officers give far less weight to un-waived letters."],quoteFromAdmissions:'"A teacher letter that recounts a specific debate where a student changed their mind after listening to a peer is worth ten generic certificates."'},{id:"pitfall-6",number:6,title:'The "Copy-Paste" Generic "Why Us?" Supplemental Essay',subtitle:"Flattery, weather comments, and swapping out university names.",severity:"High",category:"Essays",whatHappens:'Students write: "I want to attend [College] because of your world-renowned faculty, beautiful green quad, diverse student body, and vibrant urban location."',theTruth:'Admissions officers can swap out the university name with 200 other schools. If your "Why Us" essay could apply to another university, it is an automatic red flag that you did surface-level research.',beforeSnippet:'"I have always dreamed of attending NYU because of its iconic Washington Square campus, world-class professors, and the excitement of New York City."',afterSnippet:'"In Professor Aronson’s Urban Mobility Lab at NYU Wagner, I hope to research micro-transit routing in transit deserts—building directly on my work with Queens bus riders."',actionSteps:['The "Find & Replace" test: If you replace the college name with another school and the sentence still makes sense, delete it immediately.',"Name specific upper-level seminars, unique undergraduate research archives, specific student initiatives, and faculty research questions.","Connect their offerings back to YOUR track record: Don’t just praise them; explain what YOU will contribute to their seminar table."],quoteFromAdmissions:'"Do not flirt with our brochure. Tell us specifically what you will do on our campus on a rainy Tuesday afternoon."'},{id:"pitfall-7",number:7,title:"Ignoring Demonstrated Interest for Target Schools",subtitle:"Ghosting universities that track your engagement.",severity:"Moderate",category:"College Research",whatHappens:"Students apply to colleges without opening their emails, attending virtual info sessions, or doing an interview, assuming high stats are enough.",theTruth:'While Ivies and Stanford do not track demonstrated interest, many excellent mid-sized private and regional colleges (e.g., Tulane, Syracuse, American, Denison) care deeply about "yield" and will waitlist high-stat applicants they suspect are using them as backups.',beforeSnippet:"Never opens emails from College X; signs up for virtual session but doesn’t show; ignores optional alumni interview.",afterSnippet:"Opens college emails, attends virtual major info session, connects with regional admissions rep at college fair, completes optional interview.",actionSteps:['Check the university’s Common Data Set (Section C7) to see if "Level of applicant’s interest" is rated "Considered" or "Important".',"Use the same dedicated email address for all college communications and click the links inside.","Always take the optional interview if offered—it is almost always an evaluative opportunity to humanize your application."],quoteFromAdmissions:'"Colleges want students who actually want them. Protect your yield by showing genuine interest."'},{id:"pitfall-8",number:8,title:"Senioritis & Transcript Drop After Submitting",subtitle:"Letting grades plummet in senior spring and risking rescission.",severity:"High",category:"Academics & Rigor",whatHappens:"After receiving an Early Action or Early Decision acceptance in December, a student stops studying, drops from A’s to C’s and D’s, or drops their AP classes without asking.",theTruth:'Every college acceptance letter contains the phrase: "contingent upon successful completion of your senior year coursework." Every July, admissions offices send warning letters and rescind hundreds of acceptances nationwide.',beforeSnippet:"First-semester straight A’s -> Second-semester two C’s, one D, drops AP Calculus BC in March without notifying admissions.",afterSnippet:"Maintains solid B+/A- average; if struggling due to illness, immediately notifies admissions office proactively before they see the final transcript.",actionSteps:["Keep your foot on the gas through May finals and AP/IB exams.","Never drop a class listed on your Common App without prior written permission from each college’s admissions office.","Remember that colleges can and do revoke admission, downgrade scholarships, or place incoming freshmen on academic probation."],quoteFromAdmissions:'"A rescission phone call in July is the worst conversation we have all year. Don’t gamble your future for three months of slacking."'}],mh=[{id:"sports",label:"Sports Injury / Big Game Loss",topicText:"I tore my ACL during the district soccer championship, spent 6 months in physical therapy, and learned the true meaning of resilience and cheering from the sidelines.",riskLevel:"High Risk",admissionsImpression:"Admissions officers read thousands of these. Overcoming physical recovery is admirable, but it rarely reveals intellectual curiosity, academic vigor, or how you interact in a classroom.",reframingTips:["De-center the injury: Spend only 15% describing the medical event, and 85% on what you did with your newfound free time (e.g., data analysis of game tactics, mentoring middle schoolers).","Connect it to an intellectual question: Did rehab spark an obsession with biomechanics, physical therapy inequities, or sports psychology?",'Focus on relationships: Rather than "I became tough," explore a vulnerable realization about letting go of athlete-only identity.']},{id:"mission-trip",label:"Mission Trip / Volunteer Epiphany Abroad",topicText:"I went on a 7-day trip to build houses in Costa Rica and realized how fortunate I am and how the local children were so happy despite having so little.",riskLevel:"High Risk",admissionsImpression:'Often perceived as performative "voluntourism." It highlights socioeconomic privilege rather than enduring local impact, and comparing "how happy they are despite poverty" comes across as naive or condescending.',reframingTips:["Shift focus to long-term sustained action: What systemic work have you done in your OWN hometown over 2–3 continuous years?","Examine the ethics of aid: Write about recognizing the limitations of short-term volunteering and pivoting toward ethical community partnerships.","Highlight what Dear [Teacher Name],

I hope you are having a wonderful week!

I truly loved having you as my teacher for [Course Name, e.g., AP European History] this past year. In particular, our unit on [Specific Topic, e.g., the Enlightenment debates] and writing my research paper on [Specific Paper Topic] challenged my thinking and sparked my passion for [Your Intended Field of Study].

As I prepare to apply to colleges this fall to pursue [Intended Major], I was hoping you might feel comfortable writing a strong letter of recommendation on my behalf for my Common Application. Because your class pushed me intellectually and taught me how to [Specific skill, e.g., construct historical arguments with primary sources], I believe your perspective would provide meaningful insight into my work ethic and classroom engagement.

My earliest application deadline will be [Earliest Deadline, e.g., November 1st, 2025]. 

To make this as easy as possible for you, I have attached:
1. My current academic resume
2. A completed Student Brag Sheet highlighting specific assignments, class discussions, and moments I found most impactful in your course
3. My tentative college list and deadlines

Please let me know if you would be willing to write on my behalf, or if you would like to schedule a quick 10-minute chat to discuss further. I completely understand if your recommendation roster is already full.

Thank you so much for your time, support, and guidance!

Warm regards,

[Your Full Name]
